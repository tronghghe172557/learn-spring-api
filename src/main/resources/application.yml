server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # change to 'prod' when deploying to production
  application:
    name: learn-spring-api
  
  jpa: # JPA configuration
    hibernate: # Hibernate configuration
      ddl-auto: update # Automatically update the database schema
    show-sql: true # Show SQL queries in the console
    properties: # Hibernate properties
      hibernate: # Hibernate settings
        connection:
          charSet: UTF-8
          useUnicode: true # set Unicode support for character encoding
          characterEncoding: UTF-8
        format_sql: true # Format SQL queries for better readability
        use_sql_comments: true # Use SQL comments in the generated SQL
        type: trace # Enable SQL tracing
        jdbc: # JDBC settings
          lob: # Enable Large Object support
            non_contextual_creation: true # Use non-contextual creation for LOBs

  output: # Output settings
    ansi: # Enable ANSI colors in the console output
      enabled: always # Always enable ANSI colors
    servlet: # Servlet settings
      multipart: # Multipart file upload settings
        max-file-size: 2MB # Maximum file size for uploads -> implement in the future
        max-request-size: 2MB # Maximum request size for uploads -> implement in the future

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    tags-sorter: alpha
    path: /api/v1/docs
  model-and-view-converters:
    pageable-converter:
      enabled: true # Enable automatic Pageable to query parameter conversion

# Logging configuration
logging:
  level:
    root: INFO
    com.giatrong.learning.learnspringapi: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
  
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  
  file:
    name: logs/application.log
    max-size: 10MB
    total-size-cap: 100MB
    max-history: 30
    clean-history-on-start: false

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,threaddump,heapdump
      base-path: /actuator

  endpoint:
    health:
      show-details: when-authorized
      show-components: always

  health:
    diskspace:
      enabled: true
    db:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

  prometheus:
    metrics:
      export:
        enabled: true
        step: 30s

  tracing:
    sampling:
      probability: 0.1

# Application metadata
application:
  version: 1.0.0
  description: Learn Spring API - A comprehensive Spring Boot learning project
