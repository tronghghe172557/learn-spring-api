name: CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]        # chạy khi push vào nhánh dev
  pull_request:
    branches: [ "dev" ]        # chạy khi có PR vào nhánh dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code trong repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Login Docker Hub bằng secret đã lưu trong GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build & push image lên Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: giatrong/learn-spring-api:dev
